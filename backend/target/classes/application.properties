spring.config.import=optional:file:.env[.properties]
spring.application.name=fixit-backend
spring.profiles.active=${SPRING_PROFILE:dev}

# Server Configuration
server.port=${PORT:8080}
# server.servlet.context-path removed — controllers already include /api in their @RequestMapping

# Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.service-key=${SUPABASE_SERVICE_KEY}

# Image Configuration
image.max-file-size=${IMAGE_MAX_SIZE:5242880}
image.max-product-images=1
image.max-secondhand-images=4
image.allowed-extensions=jpg,jpeg,png,webp
image.allowed-mime-types=image/jpeg,image/png,image/webp
image.compression-quality=80
image.max-width=1200
image.max-height=1200
image.thumbnail-width=600
image.thumbnail-height=600

# File Upload
spring.servlet.multipart.max-file-size=${IMAGE_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${IMAGE_MAX_SIZE:5MB}

# Logging
logging.level.root=INFO
logging.level.com.fixit=DEBUG
logging.level.org.springframework.security=DEBUG

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# Security
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration=${JWT_EXPIRATION:86400000}
security.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
security.cors.allowed-headers=*
security.cors.allow-credentials=true

# Application Configuration
app.name=FIXIT Mobile Sales & Services
app.version=1.0.0
app.whatsapp-number=${WHATSAPP_NUMBER:+91XXXXXXXXXX}

# Actuator (Health, Metrics)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Database — JPA not used. Backend accesses Supabase via PostgREST HTTP API (SupabaseService).
# spring.datasource.* and spring.jpa.* blocks removed to prevent startup failure.

# Pagination defaults
app.pagination.default-page-size=20
app.pagination.max-page-size=100

# Rate Limiting (Optional)
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.requests-per-minute=60
